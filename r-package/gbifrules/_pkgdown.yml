url: https://gbif.github.io/occurrence-annotation/gbifrules/
template:
  bootstrap: 5

home:
  title: gbifrules - R Interface to GBIF Rule-Based Annotations
  description: >
    Provides R functions to facilitate interaction with the GBIF
    (Global Biodiversity Information Facility) rule-based annotation store.

reference:
  - title: "Projects"
    desc: "Functions for managing annotation projects"
    contents:
    - make_project
    - get_project
    - update_project
    - delete_project
    - add_project_member
    
  - title: "Rules"
    desc: "Functions for creating and managing annotation rules"
    contents:
    - make_rule
    - get_rule
    - update_rule
    - delete_rule
    - get_my_rules
    - get_supported_rules
    - get_contested_rules
    - support_rule
    - contest_rule
    - rm_support_rule
    - rm_contest_rule

  - title: "Rule Metrics & Leaderboards"
    desc: "Functions for aggregated rule metrics and leaderboards"
    contents:
    - get_rule_metrics
    - get_top_creators
    - get_top_projects
    - get_most_supported_creators
    - get_most_supported_projects

  - title: "Rule Comments"
    desc: "Functions for managing rule comments"
    contents:
    - make_rule_comment
    - get_rule_comment
    - delete_rule_comment

  - title: "Project Vocabulary"
    desc: "Functions for managing custom project vocabularies"
    contents:
    - get_project_vocab
    - update_project_vocab
    - delete_project_vocab

  - title: "Rulesets"
    desc: "Functions for managing rulesets"
    contents:
    - make_ruleset
    - get_ruleset
    - update_ruleset
    - delete_ruleset
    - add_ruleset_member

  - title: "Data Cleaning"
    desc: "Functions for applying rules to GBIF data"
    contents:
    - clean_download
    - annotate_download

navbar:
  structure:
    left:  [home, reference, news]
    right: [search, github]
  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/gbif/occurrence-annotation
