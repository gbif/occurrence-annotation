name: Test UI

on:
  push:
    branches: [main, dev, 'feature/**', 'security/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Security audit
        working-directory: ui
        run: |
          for attempt in 1 2 3; do
            set +e
            output=$(npm audit --omit=dev --audit-level=high 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if echo "$output" | grep -q "audit endpoint returned an error"; then
              echo "::warning::npm audit registry request failed (attempt $attempt/3)."
              sleep $((attempt * 15))
              continue
            fi
            exit "$status"
          done
          echo "::warning::Skipping security audit: the npm audit endpoint is unavailable."

      - name: Build
        working-directory: ui
        run: npm run build

      - name: Check TypeScript
        working-directory: ui
        run: npx tsc --noEmit
