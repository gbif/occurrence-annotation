name: Test r package

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GBIF_USER: ${{ secrets.GBIF_USER }}
      GBIF_PWD: ${{ secrets.GBIF_PWD }}
      GBIF_USER_NON_ADMIN: ${{ secrets.GBIF_USER_NON_ADMIN }}
      GBIF_PWD_NON_ADMIN: ${{ secrets.GBIF_PWD_NON_ADMIN }}
      GBIFRULES_URL: http://localhost:8080/occurrence/experimental/annotation/
      GBIFRULES_GITHUB_ACTIONS: true

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: annotation  # Set the database name to "annotation"
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build Spring Boot App
        run: |
          cd backend-service
          mvn clean install -DskipTests

      - name: Apply DB changelog (Liquibase)
        run: |
          mvn -B -f backend-service/pom.xml liquibase:update \
            -Dliquibase.url=jdbc:postgresql://localhost:5432/annotation \
            -Dliquibase.username=postgres \
            -Dliquibase.password=password

      - name: Sanity check
        run: |
          PGPASSWORD=password psql -h localhost -U postgres annotation -c "\dt"

      - name: Run Spring Boot App in background
        run: |
          cd backend-service
          nohup mvn spring-boot:run > spring_boot.log 2>&1 &

      - name: Wait for Spring Boot to be ready
        run: |
          echo "Waiting for Spring Boot application to start..."
          for i in {1..60}; do
            if curl -f http://localhost:8080/occurrence/experimental/annotation/rule 2>/dev/null; then
              echo "Backend is ready!"
              break
            fi
            echo "Attempt $i: Backend not ready yet, waiting 2 seconds..."
            sleep 2
          done
          # Verify it's actually up
          curl -f http://localhost:8080/occurrence/experimental/annotation/rule || (echo "Backend failed to start" && cat backend-service/spring_boot.log && exit 1)

      - name: Install libcurl and Others
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          sudo apt-get install -y texlive
          sudo apt-get install texlive-fonts-extra

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Run R Hello World
        run: |
          Rscript -e 'cat("Hello, World!\n")'

      - name: Install system dependencies for 'sf'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev

      - name: Install package dependencies (cached)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r-package/gbifrules
          dependencies: '"all"'  # all deps including Suggests (same as remotes::install_deps(dependencies = TRUE))

      - name: Test R package
        run: R CMD check r-package/gbifrules

      - name: Display spring boot nohup output
        run: cat backend-service/spring_boot.log
